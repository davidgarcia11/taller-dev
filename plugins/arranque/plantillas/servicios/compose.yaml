# Servicios locales de desarrollo. La aplicación corre en el Mac con mise; aquí solo lo que necesita.
# Puertos publicados solo en 127.0.0.1: invisibles desde la red.
name: NOMBRE

services:
  db:
    image: postgres:VERSION_POSTGRES-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql   # Postgres 18+: el volumen va en /var/lib/postgresql
      - ./docker/postgres/crear-bd-tests.sh:/docker-entrypoint-initdb.d/crear-bd-tests.sh:ro   # crea <POSTGRES_DB>_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Pruebas de email: interfaz en http://127.0.0.1:8025, SMTP en 127.0.0.1:1025.
  # mail:
  #   image: axllent/mailpit:VERSION_MAILPIT
  #   ports:
  #     - "127.0.0.1:8025:8025"
  #     - "127.0.0.1:1025:1025"

volumes:
  db-data:
