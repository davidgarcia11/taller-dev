[tasks.setup]
description = "Tras clonar: hooks de git y dependencias"
run = ["git config core.hooksPath .githooks", "go mod download"]

[tasks.check]
description = "Formato, lint, tests, build, secretos y dependencias. Igual que CI"
run = [
  "test -z \"$(gofmt -l .)\" || { gofmt -l .; exit 1; }",
  "go vet ./...",
  "golangci-lint run",
  "go test -race ./...",
  "go build ./...",
  "gitleaks git --redact --no-banner",
  "osv-scanner scan source -r . || test $? -eq 128",
]
