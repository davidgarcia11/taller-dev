# CHANGELOG generado desde los conventional commits: mise run changelog / mise run version

[changelog]
header = """
# Cambios

Todos los cambios relevantes del proyecto. Formato basado en [Keep a Changelog](https://keepachangelog.com/es-ES/1.1.0/) y versionado semántico.\n
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Sin publicar]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{% if commit.breaking %}⚠️ **Incompatible.** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Añadido" },
  { message = "^fix", group = "<!-- 1 -->Corregido" },
  { message = "^perf", group = "<!-- 2 -->Rendimiento" },
  { message = "^refactor", group = "<!-- 3 -->Cambiado" },
  { message = "^revert", group = "<!-- 4 -->Revertido" },
  { message = "^docs\\(specs\\)", skip = true },
  { message = "^docs", group = "<!-- 5 -->Documentación" },
  { message = "^(chore|ci|build|style|test)", skip = true },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = false   # en 0.x un cambio incompatible sube la menor; 1.0.0 con: git cliff --bump major
initial_tag = "v0.1.0"
