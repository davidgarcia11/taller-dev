[tasks.setup]
description = "Tras clonar: hooks de git y dependencias"
run = ["git config core.hooksPath .githooks", "uv sync --locked"]

[tasks.check]
description = "Lint, formato, tipos, tests, secretos y dependencias. Igual que CI"
run = [
  "uv run ruff check .",
  "uv run ruff format --check .",
  "uv run pyright",
  "uv run pytest",
  "gitleaks git --redact --no-banner",
  "osv-scanner scan source -r . || test $? -eq 128",
]
