[tasks.db]
description = "Levanta los servicios locales y espera a que estén listos"
run = "docker compose up -d --wait"

[tasks."db:stop"]
description = "Para los servicios locales sin borrar datos"
run = "docker compose stop"

[tasks."db:reset"]
description = "Borra los datos locales y vuelve a crear los servicios"
run = ["docker compose down -v", "docker compose up -d --wait"]
